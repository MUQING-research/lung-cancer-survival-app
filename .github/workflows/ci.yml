name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r 04_model_deployment/requirements.txt
      - run: python -m compileall -q .
      - run: python -c "import sys; sys.path.insert(0, '04_model_deployment'); import app; assert app.app is not None"
      - run: python -m unittest discover -s 03_model_training_and_evaluation -p "test_*.py" -v
